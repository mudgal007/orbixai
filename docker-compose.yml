# Local infrastructure. Postgres runs on 5433 so it never collides with a host Postgres on 5432.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: orbix
      POSTGRES_PASSWORD: orbix
      POSTGRES_DB: orbix
    ports: ["5433:5432"]
    volumes: [orbix_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbix"]
      interval: 3s
      retries: 20

  # Optional: not required by the MVP (see docs/ARCHITECTURE.md). Reserved for multi-instance
  # rate limiting and SSE fan-out.
  redis:
    image: redis:7-alpine
    profiles: ["optional"]
    ports: ["6380:6379"]

  # Full stack in containers: `docker compose --profile app up --build`
  api:
    profiles: ["app"]
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://orbix:orbix@postgres:5432/orbix
    ports: ["4000:4000"]
    depends_on: { postgres: { condition: service_healthy } }

  worker:
    profiles: ["app"]
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://orbix:orbix@postgres:5432/orbix
    depends_on: { postgres: { condition: service_healthy } }

  web:
    profiles: ["app"]
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      ORBIX_API_INTERNAL_URL: http://api:4000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  orbix_pg:
