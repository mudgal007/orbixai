name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: orbix
          POSTGRES_PASSWORD: orbix
          POSTGRES_DB: orbix
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orbix" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://orbix:orbix@localhost:5432/orbix
      ORBIX_ENCRYPTION_KEY: ${{ secrets.ORBIX_TEST_ENCRYPTION_KEY || 'MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=' }}
      ORBIX_ALLOW_PRIVATE_WEBHOOKS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: touch .env
      - run: pnpm build
      - run: pnpm db:migrate
      - name: Unit + integration tests (core, connectors, engine, api)
        run: pnpm test
      - name: Seed demo data
        run: pnpm db:seed
      - name: Start stack
        run: |
          (cd apps/api && node dist/main.js &) 
          (cd apps/worker && node dist/main.js &)
          (cd apps/web && npx next start -p 3000 &)
          npx wait-on http://localhost:4000/v1/health http://localhost:3000 --timeout 60000
      - run: npx playwright install --with-deps chromium
      - name: E2E (Playwright)
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report }

  docker:
    name: docker images + compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write .env for compose
        run: |
          echo "ORBIX_ENCRYPTION_KEY=$(openssl rand -base64 32)" > .env
          echo "NODE_ENV=production" >> .env
          echo "ORBIX_WEB_URL=http://localhost:3000" >> .env
          # Production refuses to start without a model; point at an unreachable dummy endpoint for the smoke test.
          echo "ORBIX_LLM_API_KEY=ci-dummy-key" >> .env
          echo "ORBIX_LLM_BASE_URL=http://127.0.0.1:9/v1" >> .env
      - name: Build images
        run: docker compose --profile app build
      - name: Start stack
        run: docker compose --profile app up -d
      - name: Smoke test through the web container's API proxy
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/v1/health && break; sleep 3; done
          curl -sf http://localhost:3000/api/v1/health | grep -q '"status":"ok"'
          curl -sf -c jar -H 'content-type: application/json' \
            -d '{"email":"ci@orbix.test","password":"ci-password-long-enough","name":"CI"}' \
            http://localhost:3000/api/v1/auth/signup
          curl -sf -b jar http://localhost:3000/api/v1/me | grep -q '"email":"ci@orbix.test"'
          curl -sf -o /dev/null http://localhost:3000/login
          docker compose --profile app ps
      - name: Logs on failure
        if: failure()
        run: docker compose --profile app logs --no-color --tail 200
