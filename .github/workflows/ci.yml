name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: orbix
          POSTGRES_PASSWORD: orbix
          POSTGRES_DB: orbix
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orbix" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://orbix:orbix@localhost:5432/orbix
      ORBIX_ENCRYPTION_KEY: ${{ secrets.ORBIX_TEST_ENCRYPTION_KEY || 'MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=' }}
      ORBIX_ALLOW_PRIVATE_WEBHOOKS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: touch .env
      - run: pnpm build
      - run: pnpm db:migrate
      - name: Unit + integration tests (core, connectors, engine, api)
        run: pnpm test
      - name: Seed demo data
        run: pnpm db:seed
      - name: Start stack
        run: |
          (cd apps/api && node dist/main.js &) 
          (cd apps/worker && node dist/main.js &)
          (cd apps/web && npx next start -p 3000 &)
          npx wait-on http://localhost:4000/v1/health http://localhost:3000 --timeout 60000
      - run: npx playwright install --with-deps chromium
      - name: E2E (Playwright)
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report }
